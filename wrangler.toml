# 실시간 공동 편집 Worker (Cloudflare)
#
# Next 앱(Vercel)과는 별도로 배포한다.
#   개발: npx wrangler dev
#   배포: npx wrangler deploy
#
# 시크릿은 코드에 두지 않는다:
#   npx wrangler secret put REALTIME_TOKEN_SECRET
#   npx wrangler secret put REALTIME_SERVER_SECRET
name = "weekly-report-realtime"
main = "party/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# 로그 보존. 켜지 않으면 console.error 가 실시간 tail 로만 보여서,
# 장애가 지나간 뒤에는 원인을 확인할 방법이 없다(2026-08-28 두 차례 장애 때 겪음).
[observability]
enabled = true
head_sampling_rate = 1


[[durable_objects.bindings]]
name = "WeeklyRoom"
class_name = "WeeklyRoom"

# Durable Object 는 마이그레이션 선언이 필요하다.
# SQLite 백엔드는 무료 플랜에서도 쓸 수 있다.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["WeeklyRoom"]

[vars]
# Worker 가 문서를 읽고 저장하려고 호출하는 Next 앱 주소.
# 반드시 "배포 보호(Vercel Authentication)가 걸리지 않은" 공개 운영 alias 여야 한다 —
# weekly-report-*.vercel.app 계열은 SSO 보호가 걸려 Worker 가 401 만 받는다(확인함).
# 사내 도메인을 쓰면 Vercel alias 가 바뀌어도 이 값을 고칠 필요가 없다.
# 로컬 개발은 .dev.vars 에서 덮어쓴다.
# DNS 전환(nginx 제거) 기간에는 Worker 를 사내 도메인에서 떼어 둔다.
# 사내 도메인은 nginx 를 거치며 Vercel 봇 차단(X-Vercel-Mitigated: challenge)에 걸린 적이 있고,
# Worker 의 fetch 는 자바스크립트 챌린지를 풀 수 없어 그대로 onLoad 실패로 이어진다.
# 전환이 끝나 사내 도메인이 Vercel 직결이 되면 되돌려도 된다.
NEXT_APP_URL = "https://pharos-weekly-report.vercel.app"
